name: Bug report
description: Something on the site looks or works wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the page URL and what you expected instead.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: e.g. Safari 19 on iPhone 16
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
